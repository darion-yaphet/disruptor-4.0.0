plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'idea'
    id "io.github.reyerizo.gradle.jcstress" version "1.0.0"
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id "me.champeau.jmh" version "0.7.3"
    id "biz.aQute.bnd.builder" version "7.4.0"
}

group = 'com.lmax'
version = new Version(major: 4, minor: 0, revision: 0, snapshot: true)

defaultTasks 'build'

ext {
    fullName = 'Disruptor Framework'
    fullDescription = 'Disruptor - Concurrent Programming Framework'
    teamName = 'LMAX Disruptor Development Team'
    siteUrl = 'https://lmax-exchange.github.io/disruptor'
    sourceUrl = 'git@github.com:LMAX-Exchange/disruptor.git'
    moduleName = 'com.lmax.disruptor'
}

apply from: 'gradle/maven.gradle'
apply from: 'gradle/perf.gradle'
apply from: 'gradle/jmh.gradle'
apply from: 'gradle/asciidoc.gradle'
apply from: 'gradle/jcstress.gradle'

wrapper.gradleVersion = '9.7.1'

repositories {
    mavenCentral()
}

// Gradle itself must run on JDK 17+, but the library keeps its Java 11
// bytecode promise via the toolchain below plus --release 11.
// CI passes -Pdisruptor.javaToolchain=<n> to also run tests on newer JDKs.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('disruptor.javaToolchain').getOrElse('11'))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
}

dependencies {
    checkstyle 'com.puppycrawl.tools:checkstyle:10.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    // Gradle 9 no longer injects the JUnit Platform launcher into test workers.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

compileJava {
    options.fork = true
    options.debug = true
    options.warnings = true
    options.deprecation = true
}
compileTestJava {
    options.fork = true
    options.debug = true
    options.warnings = true
    options.deprecation = true
}

test {
    useJUnitPlatform()
    systemProperties = [
            'junit.jupiter.execution.parallel.enabled': 'true',
            'junit.jupiter.execution.parallel.mode.default': 'concurrent'
    ]
}

javadoc {
    title = 'Disruptor'

    options.addStringOption('XDignore.symbol.file', '-quiet')
    options.author = true
    // Fixed year: keeps the javadoc jar reproducible (no build-time clock dependency).
    options.bottom = '<i>Copyright &#169; 2011 - 2026 LMAX Ltd. All Rights Reserved.</i>'
    options.use = true
    options.version = true
    options.showFromPublic()
}

jar {
    // No 'Built-By': it leaks the local user name and breaks reproducible archives.
    manifest.attributes('Automatic-Module-Name': moduleName)
    bundle {
        bnd(
                '-exportcontents': 'com.lmax.disruptor.*;-noimport:=true',
                '-noimportjava': 'true',
                'Import-Package': '!*',
                'Bundle-Name': fullName,
                'Bundle-Vendor': teamName,
                'Bundle-Description': fullDescription,
                'Bundle-DocURL': siteUrl,
                'Bundle-SymbolicName': moduleName,
        )
    }
}

tasks.withType(Test) {
    maxParallelForks = (int) Math.max(Math.floor(Runtime.runtime.availableProcessors() / 2), 1)
}

task setUpGitHooks(type: Exec, description: 'Add a pre-commit git hook that runs gradle check & test tasks') {
    def hooksFolder = file('.githooks').getAbsolutePath()
    commandLine 'git', 'config', 'core.hooksPath', hooksFolder
}

class Version {
    int major, minor = 0, revision = 0
    boolean snapshot
    String stage

    String toString() {
        "$major.$minor.$revision${stage ? '.' + stage : ''}${snapshot ? '-SNAPSHOT' : ''}"
    }
}

sourceSets {
    examples {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
